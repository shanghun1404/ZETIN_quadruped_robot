    <text style="font: 10px 'DejaVu Serif'; text-anchor: start" x="34.92" y="584.8848" transform="rotate(-0 34.92 584.8848)">Dcl is the homogeneous feedback characteristic; Fr adds reference memory z^-1. Reference velocity / acceleration clipping and QP changes are inactive.</text>
