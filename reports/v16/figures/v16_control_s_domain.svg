   <g id="text_17">
    <text style="font: 11px 'DejaVu Serif'" transform="translate(37.692 550.512)">Upper loop: continuous-time equivalent of the joint acceleration feedback, with ideal inverse dynamics.</text>
    <text style="font: 11px 'DejaVu Serif'" transform="translate(37.692 562.986)">Lower plant: fixed-base, no-contact source nominal model; D0 = 1.5 I. Actual USD damping is 0.</text>
    <text style="font: 11px 'DejaVu Serif'" transform="translate(37.692 575.46)">Transfer functions describe zero-initial input response; the initial-condition source is shown separately.</text>
   </g>
